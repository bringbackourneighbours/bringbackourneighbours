translatedNotes:
  ar: يتم تنظيم عيادة استشارية صحية يوم الاثنين من الساعة 15:00 إلى 17:00 ويوم الخميس من الساعة 09:00 إلى 11:00، لتلقي جميع الاستفسارات المتعلقة بالأمراض الجسدية أو النفسية أو الرسائل الطبية غير المفهومة. ولا يلزم وجود تأمين صحي
  bs: Ponedjeljkom od 15:00 do 17:00 i četvrtkom od 9:00 do 11:00 održava se savjetovanje o zdravlju za sva pitanja koja imate o fizičkim ili mentalnim zdravstvenim problemima ili o pismima vašeg ljekara koja ne razumijete. Ne trebate zdravstveno osiguranje.
  de: Montag 15:00 bis 17:00 Uhr und Donnerstag 09:00 bis 11:00 Uhr gibt es eine Gesundheitssprechstunde für alle Fragen um eine körperliche oder psychische Krankheit oder unverständliche Briefe vom Arzt. Man braucht keine Krankenversicherung.
  en: On Mondays from 3.00 pm to 5.00 pm and on Thursdays from 9.00 am to 11.00 am, there is a health advice session for any questions you may have about physical or mental health issues, or if you’ve received a letter from your doctor that you don’t understand. You don’t need health insurance.
  es: Los lunes de 15:00 a 17:00 y los jueves de 09:00 a 11:00 hay una consulta de salud para cualquier duda sobre una enfermedad física o mental, o si no entiendes las cartas del doctor. No necesitas seguro médico
  fa: روزهای دوشنبه از ساعت ۳:۰۰ تا ۵:۰۰ بعدازظهر و پنج‌شنبه از ساعت ۹:۰۰ تا ۱۱:۰۰ صبح، جلسه مشاوره سلامت برگزار می‌شود تا هر سوالی درباره مسائل جسمی یا روانی داشته باشید یا اگر نامه‌ای از پزشکتان دریافت کرده‌اید که آن را درک نمی‌کنید. نیازی به بیمه درمانی ندارید
  fr: Le lundi de 15 h à 17 h et le jeudi de 9 h à 11 h, il y a une permanence santé pour toutes les questions concernant une maladie physique ou mentale, ou encore les courriers du médecin que tu ne comprends pas. Pas besoin d'assurance maladie.
  ka: ორშაბათობით, 15:00-დან 17:00 საათამდე და ხუთშაბათობით, 09:00-დან 11:00 საათამდე, ტარდება ჯანმრთელობის საკითხებზე კონსულტაცია. შეგიძლიათ დაისვათ ნებისმიერი კითხვა ფიზიკურ ან ფსიქიკურ ჯანმრთელობასთან დაკავშირებით, ან გაარკვიოთ თქვენი ექიმის მიერ გამოწერილი გაუგებარი წერილობითი დანიშნულებები. ჯანმრთელობის დაზღვევა არ არის საჭირო.
  ku: Roja Duşemê ji saet 3:00 heta 5:00 êvarê û roja Pêncşemê ji saet 9:00 heta 11:00 serê sibê, danişîna şêwirmendiya tenduristiyê heye ji bo pirsên we yên derbarê pirsgirêkên tenduristiya fizîkî an derûnî, an jî nameyên ji doktorê we yên ku hûn fêm nakin. Pêdiviya we bi sîgorteya tenduristiyê nîne.
  tr: Pazartesi günleri 15:00 ile 17:00 arasında ve Perşembe günleri 09:00 ile 11:00 arasında, fiziksel veya ruhsal hastalıklarla ilgili tüm sorularınız ya da doktorunuzdan gelen anlaşılmaz mektuplar için bir sağlık danışma hizmeti sunulmaktadır. Sağlık sigortası gerekmez.
