translatedNotes:
  ar: 'ستجد هنا مجموعة من الخدمات المتعلقة بالصحة ومجالات أخرى: المشورة، والمساعدة الذاتية، ومكان للتلاقي في الحي. هذه الخدمات مجانية، ويمكنك الاستفادة منها بشكل مجهول إذا رغبت في ذلك، مع توفير خدمات الترجمة الفورية عند الحاجة'
  de: 'Hier findet Ihr verschiedene Angebote rund um Gesundheit und darüber hinaus. Beratung, Selbsthilfe, Nachbarschaftstreff - alles unter einem Dach. Kostenlos, auf Wunsch anonym und bei Bedarf mit Sprachmittlung.'
  en: 'Here you will find a range of services relating to health and beyond. Advice, self-help, neighbourhood meeting place - all under one roof. Free of charge, anonymous if you wish and with language mediation if required.'
  es: 'Aquí encontrará toda una serie de servicios relacionados con la salud y más allá. Asesoramiento, autoayuda, punto de encuentro vecinal: todo bajo el mismo techo. Gratuito, anónimo si lo desea y con mediación lingüística si lo necesita.'
  fa: ' در اینجا مجموعه‌ای از خدمات مرتبط با سلامت و فراتر از آن را خواهید یافت: مشاوره، خودیاری، محل گردهمایی محله. رایگان، ناشناس در صورت تمایل و با میانجیگری زبانی در صورت نیاز'
  fr: 'Vous trouverez ici différentes offres autour de la santé et au-delà. Conseil, entraide, rencontre de quartier - le tout sous un même toit. Gratuit, anonyme si vous le souhaitez et avec une médiation linguistique si nécessaire.'
  ka: 'აქ თქვენ იპოვით ჯანმრთელობასა და სხვა სფეროებთან დაკავშირებული სერვისების ფართო სპექტრს: კონსულტაცია, თვითდახმარება, სამეზობლო შეხვედრის ადგილი. უფასოდ, სურვილის შემთხვევაში ანონიმურად და, საჭიროებისამებრ, ენობრივი მედიაციით.'
  ku: 'Li vir hûn ê cûrbecûr xizmetên têkildarî tenduristiyê û derveyî wê bibînin: Şêwirmendî, xwe-alîkarî, cihê hevdîtinê yê taxê. Belaş e, heke hûn bixwazin nenas dimîne û heke pêwîst be bi navbeynkariya zimanî.'
  tr: 'Burada sağlık ve bunun ötesindeki konularda çeşitli hizmetler bulabilirsiniz: Danışmanlık, kendi kendine yardım, mahalle buluşma mekanı. Ücretsizdir; dilerseniz isimsiz olarak yararlanabilirsiniz ve gerekirse dil desteği de sağlanır.'
