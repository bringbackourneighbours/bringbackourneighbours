translatedNotes:
  ar: مشروع تابع لمنظمة «Gerede e.V.» مخصص للأشخاص من مجتمع المثليين والمثليات ومزدوجي الميل الجنسي ومغايري الهوية الجنسانية وحاملي صفات الجنسين (LGBTIQ*) الذين يخضعون لإجراءات اللجوء. يقدم المشروع استشارات قانونية بشأن إجراءات اللجوء.
  de: Ein Projekt des Gerede e.V. für lsbtiq* (queere) Personen im Asylverfahren. Das Projekt bietet eine rechtliche Beratung zum Asylverfahren an.
  en: A project run by Gerede e.V. for LGBTIQ* (queer) people going through the asylum process. The project offers legal advice on the asylum process.
  es: Un proyecto de Gerede e.V. dirigido a personas lsbtiq* (queer) que se encuentran en proceso de asilo. El proyecto ofrece asesoramiento jurídico sobre el procedimiento de asilo.
  fa: پروژه‌ای که توسط Gerede e.V. برای افراد LGBTIQ* (کوئیر) در حال طی فرایند پناهندگی اجرا می‌شود. این پروژه مشاوره حقوقی در مورد فرایند پناهندگی ارائه می‌دهد.
  fr: Un projet de l'association Gerede e.V. destiné aux personnes LGBTIQ* (queer) engagées dans une procédure d'asile. Ce projet propose des conseils juridiques concernant la procédure d'asile.
  ka: Gerede e.V.-ის მიერ მართული პროექტი ლგბტქ* (ქვირი) პირებისთვის, რომლებიც თავშესაფრის მიღების პროცესს გადიან. პროექტი უზრუნველყოფს იურიდიულ კონსულტაციას თავშესაფრის მიღების პროცესთან დაკავშირებით.
  ku: Projeyek ku ji aliyê Gerede e.V. ve ji bo kesên LGBTIQ* (queer) ên di pêvajoya penaberiyê de ye. Proje di derbarê pêvajoya penaberiyê de şêwirmendiya yasayî pêşkêş dike.
  tr: Gerede e.V. tarafından sığınma sürecindeki lsbtiq* (queer) bireyler için yürütülen bir proje. Proje, sığınma süreciyle ilgili hukuki danışmanlık hizmeti sunmaktadır.
