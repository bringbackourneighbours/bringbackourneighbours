translatedNotes:
  ar: ”الهجرة الكويرية في جنوب غرب ساكسونيا“ هو مشروع أطلقه اتحاد المثليات والمثليين (LSVD) في ساكسونيا، وهو مخصص للأشخاص الكويريين الذين مروا بتجارب اللجوء والهجرة في جنوب غرب ساكسونيا.
  de: Queermigration Südwestsachsen ist ein Projekt des Lesben- und Schwulenverband (LSVD) Sachsen für queere Menschen mit Flucht- und Migrationserfahrung in Südwestsachsen.
  en: Queermigration South-West Saxony is a project run by the Lesbian and Gay Association (LSVD) of Saxony for queer people with experience of displacement and migration in South-West Saxony.
  es: «Queermigration Südwestsachsen» es un proyecto de la Asociación de Lesbianas y Gais (LSVD) de Sajonia dirigido a personas queer con experiencias de refugio y migración en el suroeste de Sajonia.
  fa: کوئیرمهاجرت ساکسونی جنوب‌غربی پروژه‌ای است که توسط انجمن لزبین‌ها و گی‌ها (LSVD) ساکسونی برای افراد کوئیر با تجربهٔ آوارگی و مهاجرت در ساکسونی جنوب‌غربی اجرا می‌شود.
  fr: « Queermigration Südwestsachsen » est un projet de l'Association des lesbiennes et des gays (LSVD) de Saxe destiné aux personnes queer ayant vécu l'exil ou la migration dans le sud-ouest de la Saxe.
  ka: '"ქვიერმიგრაცია სამხრეთ-დასავლეთ საქსონია" არის პროექტი, რომელსაც საქსონიის ლესბოსელთა და გეი ასოციაცია (LSVD) ახორციელებს სამხრეთ-დასავლეთ საქსონიაში გადაადგილებისა და მიგრაციის გამოცდილების მქონე ქვიერი ადამიანებისთვის.'
  ku: Queermigration South-West Saxony projeyek e ku ji aliyê Komeleya Lezbiyen û Gey (LSVD) a Saksonyayê ve ji bo kesên queer ên xwedî serpêhatiya koçberî û dûrketinê li Başûrê-rojavayê Saksonyayê tê birêvebirin.
  tr: “Güneybatı Saksonya’da Queer Göç” projesi, Saksonya Lezbiyen ve Geyler Birliği (LSVD) tarafından Güneybatı Saksonya’da mültecilik ve göç deneyimi olan queer bireyler için yürütülen bir projedir.
